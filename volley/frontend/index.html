<!doctype html>
<meta charset="utf-8">
<title>Match video</title>
<style>
  :root {
    --orange: #F7941E;
    --bg: #0e1117;
    --panel: #171b26;
    --text: #fafafa;
    --muted: #8b93a7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  /* Bounding the *height* is what keeps 16:9 usable across the full page
     width - a percentage padding alone would make it 1000px tall. */
  #wrap { max-width: calc(var(--max-h, 2000px) * 16 / 9); margin: 0 auto; }
  #box {
    position: relative; width: 100%; padding-top: 56.25%;
    background: #000; border-radius: 8px; overflow: hidden;
  }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #placeholder {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; text-align: center; padding: 1rem;
    color: var(--muted); font-size: 0.9rem; line-height: 1.5;
  }
  #bar {
    margin: 0.35rem 0 0; font-size: 0.78rem; color: var(--muted);
  }
  kbd {
    background: var(--panel); border: 1px solid #2b3244; border-radius: 4px;
    padding: 0 0.3em; font-size: 0.9em; font-family: inherit;
  }
</style>

<div id="wrap">
  <div id="box">
    <iframe id="player" allow="accelerometer; encrypted-media; picture-in-picture"
            allowfullscreen hidden></iframe>
    <div id="placeholder">Add a YouTube URL for this match above.<br>
      Private videos cannot be embedded &mdash; unlisted works.</div>
  </div>
  <div id="bar">
    Click the video, then <kbd>k</kbd> play/pause &middot;
    <kbd>j</kbd><kbd>l</kbd> 10s &middot; <kbd>&larr;</kbd><kbd>&rarr;</kbd> 5s
  </div>
</div>

<script>
(function () {
  // A plain embed, deliberately. This used to drive the YouTube IFrame API so
  // Python could read the player clock; nothing needs that any more, and the
  // API was the fragile part - if its script did not re-initialise after
  // Streamlit rebuilt the frame, the panel sat on the placeholder for good.
  // An <iframe src> cannot fail that way.
  var current = "";
  var player = document.getElementById("player");
  var placeholder = document.getElementById("placeholder");

  function post(message) {
    message.isStreamlitMessage = true;
    window.parent.postMessage(message, "*");
  }
  function setHeight() {
    post({ type: "streamlit:setFrameHeight", height: document.body.scrollHeight + 2 });
  }

  function applyVideo(videoId) {
    if (!videoId) {
      current = "";
      player.hidden = true;
      player.removeAttribute("src");
      placeholder.style.display = "";
      return;
    }
    // Only touch src when the id actually changed: reassigning it reloads the
    // iframe, which would restart the video on every recorded event and defeat
    // the whole reason this is a component rather than an st.video call.
    if (videoId === current) return;
    current = videoId;
    player.src = "https://www.youtube.com/embed/" + videoId +
                 "?rel=0&modestbranding=1&playsinline=1";
    player.hidden = false;
    placeholder.style.display = "none";
  }

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || data.type !== "streamlit:render") return;
    var args = data.args || {};
    applyVideo(args.video_id || "");
    if (args.max_height) {
      document.documentElement.style.setProperty("--max-h", args.max_height + "px");
    }
    setHeight();
  });

  window.addEventListener("resize", setHeight);
  post({ type: "streamlit:componentReady", apiVersion: 1 });
  setHeight();
})();
</script>
